services:
  db:
    image: postgres:16
    container_name: annuel-postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env
    ports :
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - ./backend/docker_data/dev/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - app_network

  umami-db:
    image: postgres:16
    container_name: annuel-umami-postgres
    restart: always
    environment:
      POSTGRES_DB: ${UMAMI_DB_NAME}
      POSTGRES_USER: ${UMAMI_DB_USER}
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - ./backend/docker_data/dev/umami_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - app_network

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: annuel-umami
    restart: always
    depends_on:
      umami-db:
        condition: service_healthy
    ports:
      - "${UMAMI_PORT}:3000"
    environment:
      DATABASE_URL: postgresql://${UMAMI_DB_USER}:${UMAMI_DB_PASSWORD}@umami-db:5432/${UMAMI_DB_NAME}
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
      HASH_SALT: ${UMAMI_HASH_SALT}
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: annuel-pgadmin
    restart: always
    ports:
      - "${PGADMIN_PORT}:80"
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      TZ: Europe/Paris
    depends_on:
      - db
    volumes:
      - ./backend/docker_data/dev/pgadmin_data:/var/lib/pgadmin
    networks:
      - app_network

networks:
  app_network:
volumes:
  node_modules:


